html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
header,main{max-width:780px;margin:0 auto;padding:0 16px}
h1{font-size:1.5rem;margin:18px 0 2px}h2{font-size:1.25rem;margin:18px 0 6px}h3{font-size:1rem;margin:0 0 6px}
.sub{color:var(--mut);margin:0 0 10px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0}

<header><h1>Academic German Booster</h1><p class="sub">A self-study guide for B1–B2 learners heading to German universities (ETH Zürich, TUM, RWTH). Not a certificate or a substitute for a C1 exam.</p>
<div class="bar"><i id="pb"></i></div><p class="sm" id="pt"></p><nav id="nav"></nav></header>
<main id="m"></main>
<script>
var FORM="";
var D={
listening:{t:"Lecture listening",p:"I can follow a short lecture, name its signposts and summarise it from notes.",
 inp:"Press play, listen once without pausing, then answer. The audio is computer-generated speech from an original script written for this guide.",
 sc:`Guten Morgen. Heute geht es um Messfehler. Zunächst möchte ich einen kurzen Überblick geben. Jede Messung ist mit einer Abweichung verbunden. Man unterscheidet dabei zwei Arten von Fehlern: systematische und zufällige Fehler. Systematische Fehler entstehen zum Beispiel durch ein falsch eingestelltes Messgerät. Sie verschieben alle Messwerte in dieselbe Richtung. Zufällige Fehler hingegen schwanken von Messung zu Messung. Sie lassen sich durch mehrere Wiederholungen verringern. An einem Beispiel wird das deutlich: Wenn wir die Länge eines Stabes zehnmal messen, erhalten wir zehn leicht unterschiedliche Werte. Der Mittelwert ist dann zuverlässiger als ein einzelner Messwert. Das bedeutet aber nicht, dass der Mittelwert automatisch richtig ist. Wenn das Messgerät falsch eingestellt ist, bleibt der systematische Fehler bestehen. Daraus folgt, dass wir beide Fehlerarten getrennt betrachten müssen. Zusammenfassend lässt sich sagen: Wiederholung verringert zufällige Fehler, aber nicht systematische.`,
 ex:[["First listen","What is the topic? Which two error types are named? What is the main claim?","Topic: measurement errors. Types: systematic and random. Main claim: repeating measurements reduces random errors but not systematic ones."],
 ["Signpost hunt","Match each phrase to its function (start, contrast, example, limit on a claim, consequence, summary): Zunächst / hingegen / An einem Beispiel wird das deutlich / Das bedeutet aber nicht, dass … / Daraus folgt, dass … / Zusammenfassend lässt sich sagen","start / contrast / example / limit on a claim / consequence / summary"],
 ["Structured notes","Make a two-column page (claim | example or evidence), then compare.","Systematic errors shift all values the same way (wrongly set device). Random errors vary and shrink with repetition (measure a rod ten times, average). The average does not remove systematic error, so treat both types separately."]],
 chk:["I can state a lecture’s main claim","I can name its signpost phrases","I can summarise it from my notes"]},
reading:{t:"Academic reading",p:"I can find claim and evidence, infer words from context and say what a text does not show.",
 inp:"Original text written for this guide.",
 sc:`Die Wirksamkeit verteilter Wiederholung wird in der Lernforschung seit Langem untersucht. Verteilte Wiederholung bedeutet, dass Lerninhalte nicht an einem Stück, sondern in zeitlichen Abständen wiederholt werden. Mehrere Untersuchungen deuten darauf hin, dass dadurch das langfristige Behalten verbessert wird. Allerdings hängt der Effekt von der Art der Aufgabe und von den Abständen zwischen den Wiederholungen ab. Die Ergebnisse lassen sich daher nicht ohne Weiteres auf jede Lernsituation übertragen. Zudem ist zu beachten, dass viele Studien unter Laborbedingungen durchgeführt wurden. Ob dieselben Effekte im Schulalltag auftreten, bleibt weitgehend offen.`,
 ex:[["Argument map","Label: research question, claim, evidence, limitation, conclusion.","Question: how effective is spaced repetition? Claim: it improves long-term retention (hedged by “deuten darauf hin”). Evidence: several studies. Limitations: depends on task and intervals; mostly lab studies. Conclusion: unclear whether it transfers to everyday school."],
 ["Sentence unpacking","Mark the main clause, the subordinate clause and the verb group in: Verteilte Wiederholung bedeutet, dass Lerninhalte nicht an einem Stück, sondern in zeitlichen Abständen wiederholt werden.","Main clause: Verteilte Wiederholung bedeutet. Subordinate clause: dass … wiederholt werden (verb-final). “wiederholt werden” is a process passive."],
 ["Evidence check","True, false or not stated? 1) The text proves spaced repetition works for all learners. 2) Many studies were done in labs. 3) The text recommends schools adopt it.","1) False (results cannot simply be transferred). 2) True. 3) Not stated."]],
 chk:["I can identify claim and evidence","I can infer a word from context","I can say what the text does not show"]},
writing:{t:"Writing & grammar",p:"I can choose connectors by logic, switch between verbal and nominal style and write a short argument.",
 ex:[["Connector choice","Choose daher / allerdings / obwohl / während: 1) Die Stichprobe war klein. ___ sind die Ergebnisse vorläufig. 2) Das Verfahren ist schnell. ___ ist es ungenau. 3) ___ der Effekt klein ist, bleibt er relevant. 4) Gruppe A verbesserte sich, ___ Gruppe B unverändert blieb.","1) Daher (cause → consequence). 2) Allerdings (contrast; jedoch also works). 3) Obwohl (concession, verb-final). 4) während (contrast, verb-final)."],
 ["Verbal ↔ nominal style","Transform, then say which is clearer: a) Nachdem die Daten ausgewertet wurden, begann die Diskussion. b) Weil die Temperatur stieg, veränderte sich der Messwert. c) Die Forscher untersuchten, wie sich die Belastung auswirkt. d) Reverse: Nach der Durchführung des Versuchs wurden die Werte notiert.","a) Nach der Auswertung der Daten begann die Diskussion. b) Wegen des Anstiegs der Temperatur veränderte sich der Messwert. c) Die Forscher untersuchten die Auswirkungen der Belastung. d) Nachdem der Versuch durchgeführt worden war, wurden die Werte notiert. Nominal is shorter but denser; use the verbal version when the reader needs to see who does what."],
 ["Passive + argument paragraph","Part 1: make passive: Man erhitzt die Probe auf 80 °C. / Die Forscher werteten die Daten aus. Part 2: write 4 sentences (claim, reason, example, qualification).","Die Probe wird auf 80 °C erhitzt. / Die Daten wurden ausgewertet. (Process: “wird erhitzt”; state: “ist erhitzt”.) Model paragraph: Mehrere Studien deuten darauf hin, dass verteilte Wiederholung das langfristige Behalten von Vokabeln verbessert. Der Grund dafür ist, dass Inhalte nach einer Pause erneut aktiv abgerufen werden müssen. Ein Beispiel ist das Lernen von zehn Wörtern an drei Tagen statt an einem Tag. Allerdings gilt dies nicht für jede Aufgabe gleichermaßen, sodass die Abstände angepasst werden sollten."]],
 chk:["I can choose a connector by logic","I can switch between verbal and nominal style","I can write claim, reason, example and qualification"]},
seminar:{t:"Seminar communication",p:"I can paraphrase a point, ask for clarification and disagree politely with a reason.",
 ex:[["Build on a point","Statement: „Die Studie zeigt, dass Studierende mit Notizen besser abschneiden.“ Paraphrase it, then add your own idea.","Wenn ich Sie richtig verstanden habe, geht es um den Zusammenhang zwischen Notizen und Ergebnissen. Ich würde gern ergänzen, dass die Art der Notizen eine Rolle spielen könnte."],
 ["Choose the right frame","Which phrase fits? a) you do not understand a term b) you doubt the evidence c) you want to check you understood","a) Könnten Sie erläutern, was Sie mit „Einfluss“ meinen? b) Welche Belege gibt es für diese Annahme? c) Wenn ich Sie richtig verstanden habe, …"],
 ["Agree or disagree","Respond with a reason to: „Lernen in Gruppen ist immer effektiver als allein.“ Extension: give a 2-minute mini-presentation and answer one follow-up.","Ich sehe das anders, denn der Effekt hängt von der Gruppe ab. Ich stimme aber teilweise zu, weil Diskussionen Verständnislücken sichtbar machen."]],
 chk:["I can paraphrase before answering","I can ask for clarification","I can disagree politely with a reason"]},
stem:{t:"STEM German",p:"I can read technical German, describe a process and state a deviation and its likely cause.",
 inp:"Text (original): Ein Widerstand wird an eine Spannungsquelle angeschlossen. Bei einer Spannung von 5 V fließt ein Strom von 0,5 A. Der elektrische Widerstand beträgt somit 10 Ω.",
 ex:[["Read technically","Identify objects, actions and quantities. Say the numbers aloud in German.","Objects: Widerstand, Spannungsquelle. Actions: wird angeschlossen (passive), fließt. Quantities: 5 V, 0,5 A, 10 Ω. Aloud: fünf Volt, null Komma fünf Ampere, zehn Ohm. R = U / I; “somit” signals the consequence."],
 ["Describe a process","Steps: weigh sample → heat to 200 °C → cool → measure length. Write four sentences using zunächst, anschließend, dadurch, deshalb.","Zunächst wird die Probe gewogen. Anschließend wird sie im Ofen auf 200 °C erhitzt. Dadurch dehnt sich das Material aus. Deshalb muss die Länge nach dem Abkühlen gemessen werden."],
 ["Compounds and deviations","Split Wärmeleitfähigkeit, Messfehler, Festigkeitsprüfung and name the head word. Then compare expected 9,81 m/s² with measured 9,6 m/s².","Wärme + Leitfähigkeit (head: Leitfähigkeit); Messung + Fehler (head: Fehler); Festigkeit + Prüfung (head: Prüfung). Der erwartete Wert beträgt 9,81 m/s², gemessen wurde jedoch 9,6 m/s². Die Abweichung beträgt somit 0,21 m/s². Mögliche Ursachen sind Reibung und die Genauigkeit der Messung."]],
 chk:["I can describe a process with sequence and cause","I can read numbers and units aloud","I can state a deviation and a likely cause"]}
};
var V=[["Ergebnis","result"],["Untersuchung","study"],["Zusammenhang","connection"],["Beleg","evidence"],["Quelle","source"],["Daten","data"],["Analyse","analysis"],["These","claim"],["Argument","argument"],["Beispiel","example"],["Ursache","cause"],["Folge","consequence"],["Methode","method"],["Grundlage","basis"],["untersuchen","to investigate"],["darstellen","to present"],["erläutern","to explain"],["berücksichtigen","to take into account"],["zunächst","first"],["jedoch","however"],["daher","therefore"],["außerdem","in addition"],["zum Beispiel","for example"],["zusammenfassend","in summary"]];
var SRC=[["Council of Europe (2020). CEFR Companion Volume","https://rm.coe.int/cefr-companion-volume-with-new-descriptors-2020/16809ea0d4"],["Cummins (2008). BICS and CALP","https://doi.org/10.1007/978-0-387-30424-3_36"],["ETH Zürich. Language Requirements","https://ethz.ch/en/studies/bachelor/application/non-swiss-matriculation-certificate/language-requirements.html"],["TUM. Language Certificates","https://www.tum.de/en/studies/application/application-info-portal/admission-requirements/language-certificates"],["RWTH Aachen. FAQ","https://www.rwth-aachen.de/go/id/innr"],["IDS Mannheim. GeWiss spoken academic language","https://agd.ids-mannheim.de/GWSS_extern.shtml"],["TestDaF-Institut. Sample tasks","https://www.testdaf.de/de/teilnehmende/der-digitale-testdaf/vorbereitung-auf-den-digitalen-testdaf/beispielaufgaben-zum-digitalen-testdaf/"],["Goethe-Institut. B2 practice","https://www.goethe.de/ins/de/en/m/prf/gzb2/ue9.html"],["Goethe-Institut. C1 model test","https://bfu.goethe.de/c1mod/?wt_sc=c1-uebungen"],["Kim & Webb (2022). Spaced practice meta-analysis","https://doi.org/10.1111/lang.12479"],["Uni Leipzig. Nominalstil","https://home.uni-leipzig.de/schreibportal/nominalstil/"],["Uni Saarland. Academic writing style","https://uni-saarland.de/en/project/writing/programme/workshops/academic-writing-style-and-grammatical-structures.html"],["Uni Heidelberg IDF. Nominalisierungen","https://program.idf.uni-heidelberg.de/nominal/regeln_interpretation"],["Manchester. Academic Phrasebank","https://www.phrasebank.manchester.ac.uk/"]];
var TABS=[["home","Start"],["vocab","Vocabulary"],["listening","Listening"],["reading","Reading"],["writing","Writing"],["seminar","Seminar"],["stem","STEM"],["unis","Universities"],["sources","Sources"]];
function g(k){try{return localStorage.getItem(k)}catch(e){return null}}
function s(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function E(x){return x.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function say(id){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(D[id].sc);u.lang="de-DE";u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function stop(){try{speechSynthesis.cancel()}catch(e){}}
function prog(){var t=0,d=0;for(var k in D){D[k].chk.forEach(function(_,i){t++;if(g("c:"+k+i)==="1")d++})}
document.getElementById("pb").style.width=(t?d/t*100:0)+"%";document.getElementById("pt").textContent="Self-checks ticked: "+d+" of "+t}
function tick(k,i,el){s("c:"+k+i,el.checked?"1":"0");prog()}
function rate(id,n){s("r:"+id,n);document.querySelectorAll('[data-r="'+id+'"] button').forEach(function(b){b.classList.toggle("s",b.textContent==n)})}
function sec(k){var d=D[k],h="<h2>"+d.t+"</h2><p class=sub>Goal: "+E(d.p)+"</p>";
if(d.inp)h+="<div class=card><p>"+E(d.inp)+"</p>"+(d.sc&&k==="listening"?"<button onclick=\"say('listening')\">▶ Play</button> <button onclick=\"stop()\">■ Stop</button><details><summary>Show transcript (after listening)</summary><div class=txt>"+E(d.sc)+"</div></details>":d.sc?"<div class=txt>"+E(d.sc)+"</div>":"")+"</div>";
d.ex.forEach(function(e,i){var id=k+i,r=g("r:"+id);h+="<div class=ex><h3>"+(i+1)+". "+e[0]+"</h3><p>"+E(e[1])+"</p><details><summary>Answer key</summary><p>"+E(e[2])+"</p></details><p class=sm data-r='"+id+"'>How realistic did this feel? "+[1,2,3,4,5].map(function(n){return "<button class='r"+(r==n?" s":"")+"' onclick=\"rate('"+id+"',"+n+")\">"+n+"</button>"}).join("")+"</p></div>"});
h+="<div class=card><h3>Self-check</h3>"+d.chk.map(function(c,i){return "<label><input type=checkbox "+(g("c:"+k+i)==="1"?"checked":"")+" onchange=\"tick('"+k+"',"+i+",this)\"> "+c+"</label>"}).join("")+"</div>";
return h}
function view(){var v=location.hash.slice(1)||"home",h="";stop();
document.querySelectorAll("#nav a").forEach(function(a){a.classList.toggle("on",a.getAttribute("href")==="#"+v)});
if(D[v])h=sec(v);
else if(v==="vocab")h="<h2>Core academic vocabulary</h2><p class=sub>Learn these first. Priority tiers are my judgement of cross-subject use, not a corpus frequency count. Common and specialised tiers: see the resources document.</p><div class=tw><table><tr><th>German</th><th>English</th></tr>"+V.map(function(x){return "<tr><td>"+x[0]+"</td><td>"+x[1]+"</td></tr>"}).join("")+"</table></div>";
else if(v==="unis")h="<h2>University language requirements</h2><p class=sub>Always check your own programme’s page before applying.</p><div class=tw><table><tr><th>University</th><th>Accepted proof</th><th>Notes</th></tr><tr><td>ETH Zürich</td><td>C1 certificate (e.g. Goethe)</td><td>Not older than 2 years (Goethe C2 and ÖSD C2 up to 5). Applications 1 Dec – 31 Mar. Checked 29.9.2026.</td></tr><tr><td>TUM</td><td>DSH-2, DSD II, telc Deutsch C1 Hochschule or TestDaF level 4 in all sections</td><td>Lower thresholds for the Aerospace and Information Engineering bachelors. Checked 14.11.2026.</td></tr><tr><td>RWTH Aachen</td><td>DSH-2/3 or TestDaF 4 in all sections</td><td>Varies by programme; needs re-verifying on the official page. Checked 2.10.2026.</td></tr></table></div>";
else if(v==="sources")h="<h2>Sources</h2><p class=sub>Every method in this guide is tied to a source so you can check it yourself.</p><ul>"+SRC.map(function(x){return "<li><a href='"+x[1]+"' target=_blank rel=noopener>"+x[0]+"</a></li>"}).join("")+"</ul>";
else h="<div class=card><h2>How to use this guide</h2><p>Pick a skill tab, do the exercises, check the answer key, then tick the self-check. Academic German is a different skill from everyday German, so each skill has its own section. Progress is saved in this browser only.</p><p class=sm>Exercise texts are original, written for this guide. Treat the rating buttons as quick feedback on how realistic each exercise felt compared with real university material."+(FORM?" <a href='"+FORM+"' target=_blank rel=noopener>Send feedback</a>":"")+"</p></div>";
document.getElementById("m").innerHTML=h;window.scrollTo(0,0)}
document.getElementById("nav").innerHTML=TABS.map(function(t){return "<a href='#"+t[0]+"'>"+t[1]+"</a>"}).join("");
window.addEventListener("hashchange",view);view();prog();
</script><script>
var T=TABS;T.splice(2,0,["cards","Flashcards"]);T.splice(6,0,["grammar","Grammar"]);T.splice(T.length-1,0,["routine","Routine"]);
document.getElementById("nav").innerHTML=T.map(function(t){return "<a href='#"+t[0]+"'>"+t[1]+"</a>"}).join("");
D.listening.ex.push(["C1 stretch: a real lecture","Pick a real public lecture or talk (see Sources). Listen for 5 minutes, list 5 signpost phrases and write a 5-sentence summary.","Self-check: main claim stated? two supporting points? signposts labelled correctly? Your own words, not copied phrases?"]);
D.reading.ex.push(["C1 stretch: implicit meaning","Which words show the author is cautious? Which sentence leaves the question open?","Cautious: deuten darauf hin, nicht ohne Weiteres, weitgehend offen. Open question: Ob dieselben Effekte im Schulalltag auftreten, bleibt weitgehend offen."]);
D.writing.ex.push(["C1 stretch: hedge a claim","Rewrite cautiously: „Verteilte Wiederholung funktioniert immer.“ Use a reporting phrase and a qualification.","Model: Die Ergebnisse deuten darauf hin, dass verteilte Wiederholung in vielen Fällen wirksam ist; allerdings hängt der Effekt von der Aufgabe ab."]);
D.seminar.ex.push(["C1 stretch: counterargument","Make a claim, name a possible objection and answer it (about 90 seconds, spoken).","Model: Ich möchte die These vertreten, dass Notizen das Verständnis fördern. Ein möglicher Einwand wäre, dass sie vom Zuhören ablenken. Dem lässt sich entgegenhalten, dass strukturierte Stichwörter die Aufmerksamkeit eher lenken."]);
D.stem.ex.push(["C1 stretch: error analysis","Write 3 sentences about a measurement deviation using one passive and one nominal phrase.","Model: Die Abweichung des Messwerts vom Erwartungswert lässt sich auf Reibungsverluste zurückführen. Zudem wurde die Messgenauigkeit durch das Messgerät begrenzt. Eine Wiederholung der Messung ist daher sinnvoll."]);
SRC.push(["ETH Zürich. Public lectures and talks","https://ethz.ch/en/news-and-events/events/inaugural-farewell-introductory-lectures.html"]);
var VX="<div class=card><h3>Common tier</h3><p>Fragestellung, Forschung, Erkenntnis, Voraussetzung, Auswirkung, Ansatz, Verfahren, Begriff, Aspekt, Annahme, Bewertung, Schlussfolgerung, Einschränkung, Entwicklung, sich beziehen auf, nachweisen, ableiten, voraussetzen, darüber hinaus, allerdings, hingegen, folglich, somit, insbesondere</p><h3>Specialised or formal tier</h3><p>Daten auswerten, eine Frage aufwerfen, Begründungsschritt, Mitschnitt, Verweis, erschließen</p><p class=sm>Tiers are my judgement of cross-subject use, not a corpus frequency count. Drill the core words in Flashcards.</p></div>";
var GRr=[["Nominalization","Verbs or adjectives become nouns: compact, but can hurt clarity.","Nachdem die Daten ausgewertet wurden → Nach der Auswertung der Daten"],["Process passive","werden + Partizip II; the agent is often left out.","Die Proben werden erhitzt."],["State passive","sein + Partizip II: a resulting state.","Die Probe ist erhitzt."],["Subordinate clauses","Verb-final; express reason, contrast, concession.","Obwohl die Probe klein ist, zeigen die Daten …"],["Relative clauses","Add information; case matters.","Die Methode, die beschrieben wird, …"],["Hedging and reporting","Signal how strong a claim is.","Die Ergebnisse deuten darauf hin, dass …"],["Compounds","Find the head word, then the parts.","Wärmeleitfähigkeit = Wärme + Leitfähigkeit"]];
var GR="<h2>Academic grammar</h2><p class=sub>Structures that dominate academic German. All examples are model sentences written for this guide.</p><div class=tw><table><tr><th>Focus</th><th>What to notice</th><th>Model</th></tr>"+GRr.map(function(r){return "<tr><td>"+r.join("</td><td>")+"</td></tr>"}).join("")+"</table></div><p class=sm>Practise in the Writing tab. Sources: [4] [6] [7].</p>";
var RT="<h2>Self-study routine</h2><p class=sub>A short cycle you can repeat.</p><ol><li>Choose one objective you can observe, e.g. “I can state the main claim”.</li><li>Do a short authentic input task (text, audio or video).</li><li>Record a few useful words or phrases in context.</li><li>Retrieve them later without looking (use Flashcards).</li><li>Use at least one item in a new sentence, summary or spoken answer.</li><li>Mark what worked, what is unclear and what to practise next.</li></ol><p class=sm>Spacing research suggests revisiting content over time, but results vary with the task (Kim and Webb, 2022 [5]).</p>";
var HX="<div class=card><h3>Aiming for C1 (unofficially)</h3><p>This guide is for B2 learners working toward C1 skills. Paraphrasing the CEFR descriptors: at C1 you follow long, demanding texts and implied meaning, express ideas fluently without obvious searching for words, and use language flexibly for academic purposes. The C1 stretch exercises in each tab practise this. The guide cannot certify your level; for proof, sit TestDaF, DSH or a Goethe C1 exam [1] [3].</p><p>This guide is a launching point, not a one-size-fits-all course: work at your own pace and in your own order, and decide for yourself when a skill feels secure [1]. Numbers in square brackets point to the Sources tab.</p><p class=sm>Testers: use one section without help, say aloud what each instruction means, and note where you get stuck.</p><p><button onclick=\"cp(this)\">Copy my feedback</button> <button onclick=\"rs()\">Reset progress</button></p></div>";
function today(){return Math.floor(Date.now()/864e5)}
function Ld(){try{return JSON.parse(g("L")||"{}")}catch(e){return {}}}
